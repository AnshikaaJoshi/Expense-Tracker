openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /profile:
    get:
      operationId: getMyProfile
      tags: [profile]
      summary: Get or initialize the signed-in user's profile
      security:
        - clerkSessionCookie: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Authentication required
    put:
      operationId: updateMyProfile
      tags: [profile]
      summary: Update the signed-in user's profile
      security:
        - clerkSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: Invalid profile data
        "401":
          description: Authentication required
components:
  securitySchemes:
    clerkSessionCookie:
      type: apiKey
      in: cookie
      name: __session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    UserProfile:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
          maxLength: 80
        bio:
          type: string
          maxLength: 240
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, displayName, bio, createdAt, updatedAt]
    ProfileInput:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 80
        bio:
          type: string
          maxLength: 240
      required: [displayName, bio]

